[package]
name = "pele_typst_plugin"
version = "0.3.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pele_rs = { path = "../pele_rs" }
serde_json = { version = "1", features = ["preserve_order"] }
wasm-minimal-protocol = "0.2.1"
chrono-tz = { version = "0.10", default-features = false, features = ["std"] }
